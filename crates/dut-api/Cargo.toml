[package]
name = "dut-api"
description = "The HTTP surface: Axum routes, response DTOs, and error mapping."
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
dut-core.workspace = true
dut-mock.workspace = true
dut-telemetry.workspace = true

axum.workspace = true
flate2.workspace = true
jiff.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "sync"] }
tower-http = { workspace = true, features = ["compression-gzip", "request-id", "trace"] }
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
