[package]
name = "Dut"
version = "0.1.0"
edition = "2024"

[lib]
name = "dut"
path = "src/lib.rs"

[dependencies]
axum = "0.8.9"
bytes = "1.12.1"
csv = "1.4.0"
futures = "0.3.34"
jiff = "0.2.37"
quick-xml = { version = "0.42.0", features = ["serialize"] }
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.18"
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tower-http = { version = "0.7.1", features = ["trace", "request-id"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
url = "2.5.8"

[dev-dependencies]
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "test-util"] }
tower = { version = "0.5", features = ["util"] }
wiremock = "0.6.5"
