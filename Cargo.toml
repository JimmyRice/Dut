[workspace]
members = ["crates/*"]
# Without this, commands run at the root, such as `cargo test` and
# `cargo clippy`, would cover the binary alone and skip every crate.
default-members = [".", "crates/*"]
resolver = "3"

# Every crate shares one version, so a release bumps it here alone.
[workspace.package]
version = "0.5.2"
edition = "2024"
publish = false

[workspace.dependencies]
dut-api = { path = "crates/dut-api" }
dut-core = { path = "crates/dut-core" }
dut-http = { path = "crates/dut-http" }
dut-mock = { path = "crates/dut-mock" }
dut-monitor = { path = "crates/dut-monitor" }
dut-poll = { path = "crates/dut-poll" }
dut-telemetry = { path = "crates/dut-telemetry" }
dut-upstream = { path = "crates/dut-upstream" }

axum = "0.8.9"
bytes = "1.12.1"
# Default features are off so the binary chooses its own; see its manifest.
clap = { version = "4.6.7", default-features = false }
csv = "1.4.0"
flate2 = "1.1.9"
futures = "0.3.34"
jiff = "0.2.37"
mimalloc = "0.1.52"
nu-ansi-term = "0.50"
reqwest = { version = "0.13.5", features = ["json"] }
rlimit = "0.11.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.18"
tokio = "1.53.1"
tower = "0.5"
tower-http = "0.7.1"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
url = "2.5.8"
wiremock = "0.6.5"

# An item that is `pub` but unreachable from its crate's root must say
# `pub(crate)`, so `pub` always marks what other crates may use.
[workspace.lints.rust]
unreachable_pub = "warn"
unsafe_code = "forbid"

# The repository rules, checked by the compiler rather than by review:
# nothing outside tests may panic, index out of bounds, or convert numbers
# with `as` where the value could change. `clippy.toml` exempts tests.
[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
indexing_slicing = "warn"
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_sign_loss = "warn"

# What release archives and the container image ship: `cargo build --profile
# dist`. Fat LTO optimises the workspace crates and their dependencies as one
# program, so calls across crate boundaries inline as if everything were a
# single crate. It builds several times slower than `release`, which stays
# quick for local use.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = "symbols"
# A panic ends the process instead of one task. The service holds nothing a
# restart would lose, whereas a poller that unwinds dies quietly and leaves
# its feed frozen while the server keeps running. Without unwinding tables
# the binary is also a seventh smaller, and serves requests no slower.
panic = "abort"

# The outbound HTTPS client runs once per poll rather than once per request,
# and the regex crates and clap only parse the log filter and the command
# line at startup, so they are optimised for size. This takes a fifth off the
# binary without slowing request handling, which optimising everything for
# size slows by 15–20%.
[profile.dist.package]
clap_builder.opt-level = "s"
reqwest.opt-level = "s"
hyper-rustls.opt-level = "s"
h2.opt-level = "s"
rustls.opt-level = "s"
rustls-webpki.opt-level = "s"
aws-lc-rs.opt-level = "s"
aws-lc-sys.opt-level = "s"
regex-automata.opt-level = "s"
regex-syntax.opt-level = "s"

# The binary: configuration, wiring, and the process lifecycle. Everything it
# assembles lives in crates/.
[package]
name = "dut"
description = "Real-time Hong Kong MTR data for riders, as JSON: the backend of the MTRGo app."
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
dut-api.workspace = true
dut-core.workspace = true
dut-http.workspace = true
dut-monitor.workspace = true
dut-poll.workspace = true
dut-telemetry.workspace = true
dut-upstream.workspace = true

axum.workspace = true
# clap's defaults without coloured help, which would add six crates for text
# a server's operator rarely reads, and with `env`, so that every option can
# also be set the way containers configure a process. In the dist binary this
# costs about 180 KB, 3.5%.
clap = { workspace = true, features = [
    "derive",
    "env",
    "error-context",
    "help",
    "std",
    "suggestions",
    "usage",
    "wrap_help",
#    "color"
] }
reqwest.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing.workspace = true
url.workspace = true

[dev-dependencies]
flate2.workspace = true
futures.workspace = true
jiff.workspace = true
rlimit.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
tower = { workspace = true, features = ["util"] }
wiremock.workspace = true

[target.'cfg(target_env = "musl")'.dependencies]
mimalloc.workspace = true
