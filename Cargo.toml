[workspace]
members = ["crates/*"]
# Without this, commands run at the root, such as `cargo test` and
# `cargo clippy`, would cover the binary alone and skip every crate.
default-members = [".", "crates/*"]
resolver = "3"

# Every crate shares one version, so a release bumps it here alone.
[workspace.package]
version = "0.2.1"
edition = "2024"
publish = false

[workspace.dependencies]
dut-api = { path = "crates/dut-api" }
dut-core = { path = "crates/dut-core" }
dut-http = { path = "crates/dut-http" }
dut-monitor = { path = "crates/dut-monitor" }
dut-poll = { path = "crates/dut-poll" }
dut-telemetry = { path = "crates/dut-telemetry" }
dut-upstream = { path = "crates/dut-upstream" }

axum = "0.8.9"
bytes = "1.12.1"
csv = "1.4.0"
futures = "0.3.34"
jiff = "0.2.37"
mimalloc = "0.1.52"
nu-ansi-term = "0.50"
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.18"
tokio = "1.53.1"
tower = "0.5"
tower-http = "0.7.1"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
url = "2.5.8"
wiremock = "0.6.5"

# An item that is `pub` but unreachable from its crate's root must say
# `pub(crate)`, so `pub` always marks what other crates may use.
[workspace.lints.rust]
unreachable_pub = "warn"

# What release archives and the container image ship: `cargo build --profile
# dist`. Fat LTO optimises the workspace crates and their dependencies as one
# program, so calls across crate boundaries inline as if everything were a
# single crate. It builds several times slower than `release`, which stays
# quick for local use.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = "symbols"

# The binary: configuration, wiring, and the process lifecycle. Everything it
# assembles lives in crates/.
[package]
name = "dut"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
dut-api.workspace = true
dut-core.workspace = true
dut-http.workspace = true
dut-monitor.workspace = true
dut-poll.workspace = true
dut-telemetry.workspace = true
dut-upstream.workspace = true

axum.workspace = true
reqwest.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "signal"] }
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true

[dev-dependencies]
jiff.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tower = { workspace = true, features = ["util"] }
wiremock.workspace = true

[target.'cfg(target_env = "musl")'.dependencies]
mimalloc.workspace = true
