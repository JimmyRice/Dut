# The workflows pin every action to a commit, which only stays current if
# something proposes the updates.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Give a compromised release time to be noticed and pulled before it is
    # proposed here.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
